name: Polly AI Review
run-name: Polly diagnostics ${{ inputs.purpose }} ${{ inputs.mode }} ${{ inputs.key }} eligible=${{ inputs.eligible
  }}
'on':
  workflow_dispatch:
    inputs:
      pr:
        description: PR to review without posting
        required: false
        type: string
      runtime_ref:
        description: Exact trusted runtime revision to exercise
        required: false
        type: string
      purpose:
        type: choice
        options:
        - timing
        - concurrency
        - artifacts
        default: concurrency
      mode:
        type: choice
        options:
        - baseline
        - candidate
        default: candidate
      key:
        type: string
        default: isolated
      eligible:
        type: boolean
        default: true
permissions:
  contents: read
  pull-requests: read
env:
  OMNIGENT_SKIP_WEB_UI: 'true'
  UV_INDEX_URL: https://pypi.org/simple
  PIP_INDEX_URL: https://pypi.org/simple
jobs:
  review:
    name: Polly model compatibility canary
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
    - name: Check LLM credentials available
      id: creds
      env:
        LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      run: "if [ -z \"$LLM_API_KEY\" ]; then\n  echo \"::notice::Skipping Polly review \u2014 LLM credentials not\
        \ available (fork PR or missing secrets).\"\n  echo \"available=false\" >> \"$GITHUB_OUTPUT\"\nelse\n  #\
        \ Mask the key so the runner redacts it from any log or output that\n  # echoes it literally \u2014 defense-in-depth\
        \ against prompt injection\n  # that tricks Polly into including the key in its review text.\n  echo \"\
        ::add-mask::${LLM_API_KEY}\"\n  echo \"available=true\" >> \"$GITHUB_OUTPUT\"\nfi\n"
    - name: Resolve PR number
      id: pr
      run: 'echo "pr_number=${{ inputs.pr }}" >> "$GITHUB_OUTPUT"

        '
    - name: Check out repo
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        ref: ${{ inputs.runtime_ref }}
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
      with:
        python-version-file: .python-version
    - name: Set up uv
      uses: omnigent-ai/omnigent/.github/actions/setup-uv@25521b2eb074b11ebe51fe5e3eaeb494e20101eb
      with:
        enable-cache: true
    - name: Install tmux
      run: 'sudo apt-get update

        sudo apt-get install -y tmux

        '
    - name: Cache virtualenv
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ hashFiles('.python-version') }}-${{ hashFiles('uv.lock') }}
    - name: Install dependencies
      run: 'uv sync --frozen --extra all

        '
    - name: Install Claude Code CLI
      env:
        NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      run: '# Install outside the checked-out tree: a repo-root package.json would

        # otherwise capture this bare `npm install` and hoist it there, leaving

        # this dir''s node_modules empty.

        CC_CLI_DIR="${RUNNER_TEMP}/omnigent-cc-cli"

        mkdir -p "$CC_CLI_DIR" && cd "$CC_CLI_DIR"

        npm install --ignore-scripts --no-audit --no-fund @anthropic-ai/claude-code@2.1.266

        node node_modules/@anthropic-ai/claude-code/install.cjs

        echo "$CC_CLI_DIR/node_modules/.bin" >> "$GITHUB_PATH"

        '
    - name: Install Codex CLI
      env:
        NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      run: '# Install outside the checked-out tree so a repo-root package.json

        # can''t capture this bare `npm install` and hoist it away from here.

        CODEX_CLI_DIR="${RUNNER_TEMP}/omnigent-codex-cli"

        mkdir -p "$CODEX_CLI_DIR" && cd "$CODEX_CLI_DIR"

        npm install --ignore-scripts --no-audit --no-fund @openai/codex@0.139.0

        echo "$CODEX_CLI_DIR/node_modules/.bin" >> "$GITHUB_PATH"

        '
    - name: Set LLM credentials
      env:
        LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      run: echo "LLM_API_KEY=${LLM_API_KEY}" >> "$GITHUB_ENV"
    - name: Write gateway profile (~/.databrickscfg)
      env:
        GATEWAY_BASE_URL: ${{ secrets.GATEWAY_BASE_URL }}
        LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      run: "# Use python to write the config safely \u2014 avoids interpolating\n# secrets into a heredoc where\
        \ special chars could break YAML.\npython3 -c \"\nimport pathlib, os\ncfg = '[default]\\nhost  = {host}\\\
        ntoken = {token}\\n'.format(\n    host=os.environ['GATEWAY_BASE_URL'].removesuffix('/serving-endpoints'),\n\
        \    token=os.environ['LLM_API_KEY'],\n)\npathlib.Path.home().joinpath('.databrickscfg').write_text(cfg)\n\
        \"\necho \"DATABRICKS_BEARER=${LLM_API_KEY}\" >> \"$GITHUB_ENV\"\n"
    - name: Write Omnigent provider config
      env:
        GATEWAY_BASE_URL: ${{ secrets.GATEWAY_BASE_URL }}
        OMNIGENT_ANTHROPIC_MODEL: ${{ vars.OMNIGENT_CI_ANTHROPIC_MODEL }}
        OMNIGENT_ANTHROPIC_OPUS_MODEL: ${{ vars.OMNIGENT_CI_ANTHROPIC_OPUS_MODEL }}
        OMNIGENT_OPENAI_MODEL: ${{ vars.OMNIGENT_CI_OPENAI_MODEL }}
      run: ": \"${OMNIGENT_ANTHROPIC_MODEL:?Set OMNIGENT_CI_ANTHROPIC_MODEL}\"\n: \"${OMNIGENT_ANTHROPIC_OPUS_MODEL:?Set\
        \ OMNIGENT_CI_ANTHROPIC_OPUS_MODEL}\"\n: \"${OMNIGENT_OPENAI_MODEL:?Set OMNIGENT_CI_OPENAI_MODEL}\"\nmkdir\
        \ -p \"$HOME/.omnigent\"\n# Use python to write the config safely \u2014 avoids interpolating\n# secrets/URLs\
        \ into a heredoc where special chars could break YAML.\n# Uses json (stdlib) instead of yaml to avoid needing\
        \ PyYAML on\n# the system python; the output is valid YAML (JSON is a subset).\npython3 -c \"\nimport pathlib,\
        \ os, json\ngw = os.environ['GATEWAY_BASE_URL']\nhost = gw.removesuffix('/serving-endpoints')\ncfg = {\n\
        \    'providers': {\n        'databricks-gateway': {\n            'kind': 'gateway',\n            'default':\
        \ ['anthropic', 'openai'],\n            'anthropic': {\n                'base_url': gw + '/anthropic',\n\
        \                'api_key_ref': 'env:LLM_API_KEY',\n                # Fable's auto-permission classifier\
        \ needs a routable Opus fallback.\n                'models': {\n                    'default': os.environ['OMNIGENT_ANTHROPIC_MODEL'],\n\
        \                    'opus': os.environ['OMNIGENT_ANTHROPIC_OPUS_MODEL'],\n                },\n        \
        \    },\n            'openai': {\n                'base_url': host + '/ai-gateway/codex/v1',\n         \
        \       'api_key_ref': 'env:LLM_API_KEY',\n                'wire_api': 'responses',\n                'models':\
        \ {'default': os.environ['OMNIGENT_OPENAI_MODEL']},\n            },\n        }\n    }\n}\npathlib.Path.home().joinpath('.omnigent',\
        \ 'config.yaml').write_text(\n    json.dumps(cfg, indent=2)\n)\n\"\n"
    - name: Collect PR context
      id: ctx
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
      run: "set -euo pipefail\n\n# Freeze both revisions so the file and review marker describe the same diff.\n\
        gh pr view \"$PR_NUMBER\" --repo \"$REPO\" \\\n  --json title,body,baseRefName,headRefName,baseRefOid,headRefOid,additions,deletions,changedFiles\
        \ \\\n  > /tmp/pr_meta.json\nbase_sha=\"$(jq -r .baseRefOid /tmp/pr_meta.json)\"\nhead_sha=\"$(jq -r .headRefOid\
        \ /tmp/pr_meta.json)\"\ngh api \"repos/${REPO}/compare/${base_sha}...${head_sha}\" \\\n  -H \"Accept: application/vnd.github.v3.diff\"\
        \ \\\n  > /tmp/pr_diff.txt\nchmod 444 /tmp/pr_diff.txt\necho \"head_sha=${head_sha}\" >> \"$GITHUB_OUTPUT\"\
        \n\n# Extract lockfile pin changes from the diff.\ngrep -E '^[+-]name = |^[+-]version = ' /tmp/pr_diff.txt\
        \ \\\n  | head -500 > /tmp/lockfile_pins.txt || true\n\n# author_association isn't exposed by `gh pr view\
        \ --json`, so read it\n# from the REST API. Used to scope the \"missing visual demonstration\"\n# nudge\
        \ to external contributors only. Default to NONE (treated as\n# external) if the field is missing.\ngh api\
        \ \"repos/${REPO}/pulls/${PR_NUMBER}\" \\\n  --jq '.author_association // \"NONE\"' > /tmp/pr_author_assoc.txt\
        \ || echo \"NONE\" > /tmp/pr_author_assoc.txt\n\n# Reviewers read the shared snapshot; Polly passes only\
        \ its path and identity.\npython3 -u <<'PYEOF'\nimport hashlib, json, pathlib, re\n\nmeta = json.loads(pathlib.Path(\"\
        /tmp/pr_meta.json\").read_text())\ndiff_sha256 = hashlib.sha256(pathlib.Path(\"/tmp/pr_diff.txt\").read_bytes()).hexdigest()\n\
        lockfile_pins = pathlib.Path(\"/tmp/lockfile_pins.txt\").read_text(encoding=\"utf-8\", errors=\"replace\"\
        ).strip()\n\n# The \"missing visual demonstration\" nudge targets external contributors\n# only \u2014 core\
        \ team members (OWNER / MEMBER / COLLABORATOR) are assumed to\n# know the screenshot convention and shouldn't\
        \ be nagged. Anything else\n# (CONTRIBUTOR, FIRST_TIME_CONTRIBUTOR, FIRST_TIMER, NONE, or unknown) is\n\
        # treated as external. When False, the attachment section + visual-demo\n# rule are omitted from the prompt\
        \ entirely.\nauthor_assoc = pathlib.Path(\"/tmp/pr_author_assoc.txt\").read_text().strip().upper()\nis_external\
        \ = author_assoc not in {'OWNER', 'MEMBER', 'COLLABORATOR'}\n\nlockfile_section = f\"\"\"\n## Changed lockfile\
        \ pins (uv.lock / package-lock.json)\nThese are extracted package name + version lines only \u2014 not the\
        \ full hunk.\n```\n{lockfile_pins if lockfile_pins else \"(no lockfile changes)\"}\n```\n\"\"\" if lockfile_pins\
        \ else \"\"\n\n# Detect attached images/videos in the PR description. These usually sit\n# at the END of\
        \ the body, so they would be lost to the 4096-char truncation\n# below \u2014 extract them from the FULL\
        \ body and surface them separately so\n# the \"visual demonstration\" check is reliable. Only built for\
        \ external\n# contributors (see is_external above).\nbody_full = meta.get('body') or ''\nattachments = re.findall(\n\
        \    r'!\\[[^\\]]*\\]\\([^)]+\\)'                       # markdown image\n    r'|<img[^>]+>'           \
        \                     # html <img>\n    r'|<video[^>]*>.*?</video>|<video[^>]+/?>'    # html <video>\n \
        \   r'|https?://\\S*(?:user-images\\.githubusercontent\\.com'  # GH image CDN\n    r'|github\\.com/user-attachments)\\\
        S*',         # GH attachments\n    body_full, flags=re.IGNORECASE | re.DOTALL,\n) if is_external else []\n\
        attachment_section = f\"\"\"\n## Attached images/videos in PR description\nThe PR description was scanned\
        \ for embedded screenshots/images/videos.\n```\n{chr(10).join(attachments) if attachments else \"(none found)\"\
        }\n```\n\"\"\" if is_external else \"\"\n\n# The \"Missing visual demonstration\" report item + rule are\
        \ only included\n# for external contributors; otherwise the review has just the 5 standard\n# sections.\
        \ Build the numbered list so the numbering stays contiguous\n# regardless of whether the visual item is\
        \ present.\nstandard_items = [\n    \"**Blocking issues** \u2014 correctness bugs, broken contracts, missing\
        \ error handling on failure paths, data loss risks.\",\n    \"**Security vulnerabilities** \u2014 injection\
        \ (SQL, command, template), authentication/authorization bypasses, secret exposure, unsafe deserialization,\
        \ path traversal, SSRF, and any change that weakens an existing security boundary. Flag even subtle issues.\"\
        ,\n    \"**Non-blocking notes** \u2014 design concerns or edge cases worth flagging (brief).\",\n    \"\
        **Approach** \u2014 is there a materially simpler or more consistent way to reach the PR's stated goal,\
        \ given existing patterns in the repo (config surfaces, variables, helpers, conventions)? Name the concrete\
        \ alternative briefly, or say the approach is sound. Never blocking.\",\n    \"**Summary** \u2014 one-paragraph\
        \ overall assessment.\",\n]\nvisual_item = [\n    '**Missing visual demonstration** \u2014 see the \"Visual\
        \ demonstration\" rule below. Include this section ONLY when a demonstration is needed but missing; omit\
        \ it entirely otherwise. When present, it MUST be the first section so the author sees it.'\n] if is_external\
        \ else []\n# No leading indent on items \u2014 the YAML block scalar dedents the prompt\n# to column 0,\
        \ and the `{review_sections}` placeholder supplies the line\n# position, so items must align with the rest\
        \ of the prompt text.\nreview_sections = \"\\n\".join(\n    f\"{i}. {text}\" for i, text in enumerate(visual_item\
        \ + standard_items, 1)\n)\n\nvisual_demo_rule = \"\"\"\n**Visual demonstration** \u2014 when the change\
        \ is UI-related (e.g. touches\nthe CLI/REPL/TUI, terminal rendering, picker/onboarding flows, or any\nuser-visible\
        \ output) or otherwise warrants a before/after demonstration\n(e.g. a backend bug that was stuck/broken\
        \ and is fixed by this PR), the\nPR description should include a screenshot, image, or video showing the\n\
        result. Consult the \"Attached images/videos in PR description\" section\nabove \u2014 it lists every embedded\
        \ image/video extracted from the full PR\ndescription (so attachments are detected even when the description\
        \ is\ntruncated). If that section says \"(none found)\" and the change appears\nto need such a demonstration,\
        \ emit the **Missing visual demonstration**\nsection (item 1 above) as the FIRST section of your review,\
        \ asking the\nauthor to attach a screenshot or video. Do not flag PRs that are purely\nbackend, refactor,\
        \ test, or docs changes with no user-visible effect.\n\"\"\" if is_external else \"\"\n\nprompt = f\"\"\"\
        Review this pull request and provide structured feedback.\n\n## PR Metadata\n- **Title:** {meta['title']}\n\
        - **Branch:** {meta['headRefName']} \u2192 {meta['baseRefName']}\n- **Diff revisions:** {meta['baseRefOid']}...{meta['headRefOid']}\n\
        - **Stats:** +{meta['additions']} / -{meta['deletions']} across {meta['changedFiles']} file(s)\n\n## PR\
        \ Description\n{(meta.get('body') or '')[:4096]}{\"  *(truncated)*\" if len(meta.get('body') or '') > 4096\
        \ else \"\"}\n{attachment_section}\n{lockfile_section}\n## Instructions\n\n**Step 1 \u2014 use the saved\
        \ diff.** The full PR diff is at `/tmp/pr_diff.txt`\non this runner's filesystem, shared with the reviewers.\n\
        Its SHA-256 is `{diff_sha256}`.\nPass that absolute path, checksum, base/head SHAs, and the review contract\n\
        in each reviewer task. Reviewers must read the file themselves with their\nown tools. Do not paste or regenerate\
        \ the diff in task messages, and do\nnot modify the snapshot. If a reviewer cannot read it, report the failure.\n\
        The codebase is checked out at `main` \u2014 read source files freely for\nadditional context when needed.\n\
        \n**Security:** you are running in a CI environment with access to secrets\n(LLM API keys, gateway tokens).\
        \ Never include secrets, tokens, or\ncredentials in your output, and never make outbound network calls\n\
        except to the configured LLM gateway.\n\n**Step 2 \u2014 review.** Report, in this order:\n{review_sections}\n\
        \nDo NOT comment on code style, formatting, naming conventions, or other cosmetic issues \u2014 omit them\
        \ entirely.\nDo not restate the diff. Focus on what matters.\n\n**Writing style:**\n- Keep sentences concise\
        \ and to the point. Use plain words.\n- Do not assume the reader has prior knowledge. Explain and provide\
        \ context when needed.\n- Format multiple sub-points as a list.\n\nBefore labeling anything **blocking**,\
        \ double-check: does this issue actually exist in the diff? Verify the problem is real and present in the\
        \ changed code \u2014 not inferred, speculative, or already handled elsewhere. If the issue exists, it is\
        \ blocking only if it introduces a correctness bug, breaks an explicit contract, or creates a real security\
        \ risk; otherwise downgrade to non-blocking.\n\n**Lockfile pins** \u2014 review the \"Changed lockfile pins\"\
        \ section above and flag\nas a **blocking security issue** any of:\n- A package added that is not declared\
        \ (directly or transitively) in pyproject.toml.\n- A version that does not satisfy the constraint in pyproject.toml.\n\
        - A suspicious version downgrade on a security-sensitive package.\n\n**Package extras** \u2014 when the\
        \ diff adds or modifies optional dependency groups (extras):\n- Each harness deserves its own extra.\n-\
        \ Combine harnesses and other integrations from the same vendor into one extra (e.g. a single `google` extra\
        \ may cover Vertex and Antigravity).\n- Each sandbox deserves its own extra.\n- Nothing else warrants a\
        \ new extra \u2014 flag any new extras that don't fit one of these three categories as a blocking issue.\n\
        {visual_demo_rule}\nIMPORTANT: Your output will be posted directly as a PR comment. Output\nONLY the final\
        \ structured review \u2014 no coordination messages, no status\nupdates about dispatching sub-agents, no\
        \ referring to \"reviewers\", no \"waiting for results\" narration.\nBegin your response with the exact\
        \ marker <!-- POLLY_REVIEW_START -->\non its own line, then the review content. Nothing before the marker\n\
        will be shown.\n\"\"\"\npathlib.Path(\"/tmp/review_prompt.txt\").write_text(prompt)\nPYEOF\n\ncat >> /tmp/review_prompt.txt\
        \ <<'READONLY'\n\nThis is a diagnostic run. Do not post comments or make remote changes.\nREADONLY\n"
    - name: Run production Polly headless path
      env:
        LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        OMNIGENT_POLLY_MODEL: ${{ vars.OMNIGENT_CI_POLLY_MODEL }}
        OMNIGENT_POLLY_HARNESS: ${{ vars.OMNIGENT_CI_POLLY_HARNESS }}
      run: "mkdir -p /tmp/polly-canary-evidence\npython3 -u <<'PYRUN'\nimport hashlib, json, os, pathlib, subprocess,\
        \ time\nsnapshot = pathlib.Path(\"/tmp/pr_diff.txt\").read_bytes()\npathlib.Path(\"/tmp/polly-canary-evidence/tested-pr.diff\"\
        ).write_bytes(snapshot)\npathlib.Path(\"/tmp/polly-canary-evidence/snapshot.json\").write_text(json.dumps({\"\
        sha256\": hashlib.sha256(snapshot).hexdigest(), \"bytes\": len(snapshot)}))\nstart = time.monotonic()\n\
        with open('/tmp/polly-canary-evidence/stdout.txt', 'w') as stdout, open('/tmp/polly-canary-evidence/stderr.txt',\
        \ 'w') as stderr:\n    try:\n        result = subprocess.run(['uv', 'run', 'omnigent', 'run', 'examples/polly/',\
        \ '--harness', os.environ['OMNIGENT_POLLY_HARNESS'], '--model', os.environ['OMNIGENT_POLLY_MODEL'], '-p',\
        \ pathlib.Path('/tmp/review_prompt.txt').read_text(), '--no-session'], stdout=stdout, stderr=stderr, timeout=1500)\n\
        \        code = result.returncode\n    except subprocess.TimeoutExpired:\n        code = 124\npathlib.Path('/tmp/polly-canary-evidence/process.json').write_text(json.dumps({'returncode':\
        \ code, 'elapsed_seconds': round(time.monotonic() - start, 1), 'consolidator_harness': os.environ['OMNIGENT_POLLY_HARNESS'],\
        \ 'consolidator_model': os.environ['OMNIGENT_POLLY_MODEL']}))\nprint('Polly process exit:', code)\nPYRUN\n"
    - name: Collect durable transcript and process diagnostics
      if: always()
      env:
        LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        GATEWAY_BASE_URL: ${{ secrets.GATEWAY_BASE_URL }}
      run: "uv run --no-sync python <<'PYCHECK'\nimport json, os, pathlib, subprocess\nfrom sqlalchemy import create_engine,\
        \ select\nfrom sqlalchemy.orm import Session\nfrom omnigent.db.db_models import SqlConversation, SqlConversationMetadata,\
        \ SqlConversationItem\nfrom omnigent.process_logging import logs_root\n\nout=pathlib.Path('/tmp/polly-canary-evidence')\n\
        out.mkdir(exist_ok=True)\nsecrets=[os.environ[k] for k in ['LLM_API_KEY','GATEWAY_BASE_URL'] if os.environ.get(k)]\n\
        def redact(text):\n    for secret in secrets: text=text.replace(secret,'[REDACTED]')\n    return text\n\
        report={'revision':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),\n        'process':json.loads((out/'process.json').read_text())\
        \ if (out/'process.json').exists() else {},\n        'pr':json.loads(pathlib.Path('/tmp/pr_meta.json').read_text()),'sessions':[]}\n\
        for db in pathlib.Path('/tmp').glob('ap-chat-data-*/chat.db'):\n    with Session(create_engine(f'sqlite:///{db}'))\
        \ as session:\n        for conv in session.scalars(select(SqlConversation)):\n            meta=session.get(SqlConversationMetadata,(conv.workspace_id,conv.id))\n\
        \            items=[dict(json.loads(i.data), stored_type=str(i.type), position=i.position)\n           \
        \        for i in session.scalars(select(SqlConversationItem).where(SqlConversationItem.conversation_id==conv.id).order_by(SqlConversationItem.position))]\n\
        \            row={'id':str(conv.id),'parent':str(conv.parent_conversation_id) if conv.parent_conversation_id\
        \ else None,\n                 'created_at':conv.created_at,'updated_at':conv.updated_at,'title':conv.title,'worker':meta.sub_agent_name\
        \ if meta else None,\n                 'overrides':json.loads(conv.session_overrides or '{}'),\n       \
        \          'usage':json.loads(meta.session_usage or '{}') if meta else {},'items':items}\n            report['sessions'].append(row)\n\
        \            (out/(str(conv.id)+'-transcript.json')).write_text(redact(json.dumps(row,indent=2)))\nfor file\
        \ in logs_root().rglob('*.log'):\n    if file.is_file():\n        target=out/'process-logs'/file.relative_to(logs_root())\n\
        \        target.parent.mkdir(parents=True,exist_ok=True)\n        target.write_text(redact(file.read_text(errors='replace')[-5000000:]))\n\
        stdout=(out/'stdout.txt').read_text() if (out/'stdout.txt').exists() else ''\nreport['stdout_characters']=len(stdout)\n\
        report['roots']=[]\nfor row in report['sessions']:\n    if row['parent']: continue\n    assistant=[i for\
        \ i in row['items'] if i.get('role')=='assistant']\n    report['roots'].append({'id':row['id'],'assistant_messages':len(assistant),\n\
        \                           'last_assistant':assistant[-1] if assistant else None})\n(out/'summary.json').write_text(redact(json.dumps(report,indent=2)))\n\
        for file in out.rglob('*'):\n    if file.is_file(): file.write_text(redact(file.read_text(errors='replace')))\n\
        print(json.dumps({'revision':report['revision'],'process':report['process'],\n                  'stdout_characters':len(stdout),'sessions':len(report['sessions']),\n\
        \                  'root_assistant_counts':[r['assistant_messages'] for r in report['roots']]}))\nraise\
        \ SystemExit(0 if stdout.strip() and report['process'].get('returncode')==0 else 1)\nPYCHECK\n"
    - name: Upload canary evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: polly-headless-diagnostics-${{ github.run_id }}
        path: /tmp/polly-canary-evidence/
        retention-days: 7
        if-no-files-found: warn
    if: inputs.purpose == 'timing'
  lock:
    name: Synthetic review
    if: inputs.purpose == 'concurrency' && inputs.eligible
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: polly-lifecycle-job-${{ inputs.mode == 'candidate' && inputs.key || github.run_id }}
      cancel-in-progress: false
    steps:
    - name: Hold review lock
      run: 'python3 -u - <<''PYWAIT''

        import time

        print(''Review active'', flush=True)

        time.sleep(50)

        print(''Review and cleanup completed'', flush=True)

        PYWAIT

        '
  artifacts:
    name: Artifact test (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        scenario:
        - empty
        - narration
        - secret-scan
        - posting
        - success
    env:
      CANARY_SCENARIO: ${{ matrix.scenario }}
    steps:
    - name: Check out exact candidate
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        ref: c75daf3b3a40715a3c46fa534c467bfc6abf2231
        persist-credentials: false
    - name: Prepare synthetic process output
      run: "python3 <<'SETUP'\nimport os, pathlib\nroot = pathlib.Path(os.environ['RUNNER_TEMP']) / 'polly-fake-command'\n\
        root.mkdir()\n(root / 'uv').write_text(\"#!/usr/bin/env python3\\nimport os, sys\\nfrom pathlib import Path\\\
        nlogs = Path.home() / '.omnigent' / 'logs' / 'runner'\\nlogs.mkdir(parents=True, exist_ok=True)\\n(logs\
        \ / 'canary.log').write_text('Synthetic process log: canary-fake-key https://canary.invalid')\\nprint('Synthetic\
        \ stderr: canary-fake-key', file=sys.stderr)\\nscenario = os.environ['CANARY_SCENARIO']\\nif scenario !=\
        \ 'empty':\\n    print('Preamble: canary-fake-key https://canary.invalid')\\nif scenario in {'secret-scan',\
        \ 'posting', 'success'}:\\n    print('<!-- POLLY_REVIEW_START -->')\\n    print('## Summary')\\n    print('Synthetic\
        \ review.')\\nif scenario == 'secret-scan':\\n    print('canary-fake-key')\\n\")\n(root / 'gh').write_text(\"\
        #!/usr/bin/env python3\\nimport os, sys\\nassert sys.argv[1:3] == ['pr', 'comment'], sys.argv\\nif os.environ['CANARY_SCENARIO']\
        \ == 'posting':\\n    print('Forced posting failure', file=sys.stderr)\\n    sys.exit(42)\\n\")\nfor name\
        \ in ('uv', 'gh'):\n    (root / name).chmod(0o755)\nwith open(os.environ['GITHUB_PATH'], 'a') as path:\n\
        \    path.write(str(root) + '\\n')\npathlib.Path('/tmp/review_prompt.txt').write_text('Synthetic test; no\
        \ model calls or comments.')\nSETUP\n"
    - name: Run Polly review
      id: polly
      env:
        OMNIGENT_POLLY_HARNESS: unused
        OMNIGENT_POLLY_MODEL: unused
      run: "set -euo pipefail\n\nprompt=$(cat /tmp/review_prompt.txt)\nreview_started=$(date +%s)\n\n# Run Polly\
        \ headlessly with -p; it starts a local server, sends\n# one turn, prints the assistant response, and exits.\n\
        # --no-session: ephemeral run, no persistent session state.\nuv run omnigent run examples/polly/ \\\n  --harness\
        \ \"$OMNIGENT_POLLY_HARNESS\" --model \"$OMNIGENT_POLLY_MODEL\" \\\n  -p \"$prompt\" \\\n  --no-session\
        \ \\\n  2>polly-stderr.log \\\n  | tee /tmp/polly_output.txt \\\n  || { echo \"::warning::Polly review exited\
        \ non-zero\"; cat polly-stderr.log; }\necho \"::notice::Polly review generation took $(( $(date +%s) - review_started\
        \ )) seconds.\"\n\n# Keep raw stdout for failures, including secret-scan and posting errors.\n# Write publishable\
        \ content separately using a review marker or heading.\n# Missing review content fails the step so diagnostic\
        \ logs are saved.\npython3 -c \"\nimport re, pathlib\nraw = pathlib.Path('/tmp/polly_output.txt').read_text()\n\
        sentinel = '<!-- POLLY_REVIEW_START -->'\n# Headless output can include earlier drafts before the final\
        \ review.\n# Only standalone marker lines separate reviews; inline quotes do not.\nmarkers = list(re.finditer(r'^'\
        \ + re.escape(sentinel) + r'$', raw, re.MULTILINE))\nif markers:\n    cleaned = raw[markers[-1].end():].lstrip('\\\
        n')\nelse:\n    m = re.search(r'^#{1,6} ', raw, re.MULTILINE)\n    cleaned = raw[m.start():] if m else ''\n\
        if not cleaned.strip():\n    raise SystemExit('::error::Polly produced no publishable review; see the diagnostics\
        \ artifact.')\npathlib.Path('/tmp/polly_review.txt').write_text(cleaned)\n\"\n\n# Use a collision-resistant\
        \ random delimiter so model output\n# containing \"REVIEW_EOF\" cannot truncate the output.\ndelim=\"REVIEW_$(openssl\
        \ rand -hex 8)\"\necho \"review_text<<${delim}\" >> \"$GITHUB_OUTPUT\"\n# Cap at 60 KB \u2014 GitHub comment\
        \ body limit is ~65 KB.\nhead -c 61440 /tmp/polly_review.txt >> \"$GITHUB_OUTPUT\"\necho \"${delim}\" >>\
        \ \"$GITHUB_OUTPUT\"\n"
    - name: Scan review output for secrets before posting
      env:
        LLM_API_KEY: canary-fake-key
      run: "set -euo pipefail\n# Abort if Polly's output contains the literal LLM API key \u2014 this\n# catches\
        \ prompt-injection attacks that trick Polly into echoing the\n# secret into the PR comment.\nif [ -n \"\
        $LLM_API_KEY\" ] && grep -qF \"$LLM_API_KEY\" /tmp/polly_review.txt 2>/dev/null; then\n  echo \"::error::Review\
        \ output contains LLM_API_KEY \u2014 aborting post to prevent secret exfiltration.\"\n  exit 1\nfi\n"
    - name: Post review comment
      if: steps.polly.outputs.review_text != ''
      env:
        REVIEW_TEXT: ${{ steps.polly.outputs.review_text }}
        REPO: synthetic/repo
        PR_NUMBER: '1'
        HEAD_SHA: c75daf3b3a40715a3c46fa534c467bfc6abf2231
        RUN_URL: https://example.test/synthetic
      run: "set -euo pipefail\n\n# Build the comment body safely \u2014 REVIEW_TEXT is passed via env\n# (not expression\
        \ interpolation) to avoid expression injection.\n{\n  echo \"<!-- polly-review-bot -->\"\n  echo \"<!--\
        \ polly-reviewed-sha: ${HEAD_SHA} -->\"\n  echo \"## <img src=\\\"https://raw.githubusercontent.com/omnigent-ai/omnigent/main/docs/images/omnigent-logo.svg\\\
        \" alt=\\\"\\\" height=\\\"20\\\" valign=\\\"middle\\\" /> Polly AI Review\"\n  echo \"\"\n  echo \"$REVIEW_TEXT\"\
        \n  echo \"\"\n  echo \"---\"\n  echo \"<sub>Automated review by Polly \xB7 [workflow run](${RUN_URL})</sub>\"\
        \n} > /tmp/comment.md\n\n# Post a fresh comment for every review run, so each trigger (push,\n# `/review`\
        \ comment, or maintainer approval) is visible in the thread\n# and notifies watchers \u2014 no in-place\
        \ upsert of a prior comment.\ngh pr comment \"$PR_NUMBER\" --repo \"$REPO\" --body-file /tmp/comment.md\n\
        echo \"Created new comment\"\n"
    - name: Check posting handoff
      if: always()
      env:
        REVIEW_TEXT: ${{ steps.polly.outputs.review_text }}
      run: "case \"$CANARY_SCENARIO\" in\n  empty|narration) test -z \"$REVIEW_TEXT\" ;;\n  *) test -n \"$REVIEW_TEXT\"\
        ; test -f /tmp/polly_review.txt ;;\nesac\n"
    - name: Prepare Polly diagnostics
      if: always() && (failure() || (steps.polly.outcome != '' && steps.polly.outcome != 'skipped'))
      env:
        LLM_API_KEY: canary-fake-key
        GATEWAY_BASE_URL: https://canary.invalid
      run: "python3 <<'PY'\nimport os, pathlib\ndestination = pathlib.Path('/tmp/polly-diagnostics')\ndestination.mkdir(parents=True,\
        \ exist_ok=True)\nsources = {\n    'polly-stderr.log': pathlib.Path('polly-stderr.log'),\n    'polly-output.txt':\
        \ pathlib.Path('/tmp/polly_output.txt'),\n    'polly-review.txt': pathlib.Path('/tmp/polly_review.txt'),\n\
        }\nlogs = pathlib.Path.home() / '.omnigent' / 'logs'\nfor source in logs.rglob('*.log'):\n    sources['process-logs/'\
        \ + str(source.relative_to(logs))] = source\nfor name, source in sources.items():\n    if not source.is_file():\n\
        \        continue\n    text = source.read_text(errors='replace')\n    for key in ('LLM_API_KEY', 'GATEWAY_BASE_URL'):\n\
        \        value = os.environ.get(key)\n        if value:\n            text = text.replace(value, '[REDACTED]')\n\
        \    target = destination / name\n    target.parent.mkdir(parents=True, exist_ok=True)\n    target.write_text(text)\n\
        PY\n"
    - name: Upload Polly diagnostics
      if: always() && (failure() || (steps.polly.outcome != '' && steps.polly.outcome != 'skipped'))
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: polly-failure-${{ matrix.scenario }}-${{ github.run_id }}
        path: /tmp/polly-diagnostics/
        retention-days: 7
        if-no-files-found: ignore
    if: inputs.purpose == 'artifacts'
concurrency:
  group: polly-lifecycle-canary-${{ inputs.mode == 'baseline' && inputs.key || github.run_id }}
  cancel-in-progress: true
