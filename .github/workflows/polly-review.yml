name: Polly AI Review
run-name: Polly empty-output guard and failure-artifact canary
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  guard:
    name: Expected failure (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        scenario:
        - empty
        - narration
    env:
      CANARY_SCENARIO: ${{ matrix.scenario }}
    steps:
    - name: Check out exact candidate
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        ref: 563754a9b3423298d515f8e85992ced34356b10b
        persist-credentials: false
    - name: Prepare synthetic process output
      run: "python3 <<'SETUP'\nimport os, pathlib\nroot = pathlib.Path(os.environ['RUNNER_TEMP']) / 'polly-fake-command'\n\
        root.mkdir()\n(root / 'uv').write_text(\"#!/usr/bin/env python3\\nimport os, sys\\nfrom pathlib\
        \ import Path\\nlogs = Path.home() / '.omnigent' / 'logs' / 'runner'\\nlogs.mkdir(parents=True,\
        \ exist_ok=True)\\n(logs / 'canary.log').write_text('Synthetic process log: canary-fake-key https://canary.invalid')\\\
        nprint('Synthetic stderr: canary-fake-key', file=sys.stderr)\\nif os.environ['CANARY_SCENARIO']\
        \ == 'narration':\\n    print('Waiting for reviewers. https://canary.invalid')\\n\")\n(root /\
        \ 'uv').chmod(0o755)\nwith open(os.environ['GITHUB_PATH'], 'a') as path:\n    path.write(str(root)\
        \ + '\\n')\npathlib.Path('/tmp/review_prompt.txt').write_text('Synthetic test; no model calls\
        \ or comments.')\nSETUP\n"
    - name: Run Polly review
      id: polly
      env:
        OMNIGENT_POLLY_HARNESS: unused
        OMNIGENT_POLLY_MODEL: unused
      run: "set -euo pipefail\n\nprompt=$(cat /tmp/review_prompt.txt)\n\n# Run Polly headlessly with -p;\
        \ it starts a local server, sends\n# one turn, prints the assistant response, and exits.\n# --no-session:\
        \ ephemeral run, no persistent session state.\nuv run omnigent run examples/polly/ \\\n  --harness\
        \ \"$OMNIGENT_POLLY_HARNESS\" --model \"$OMNIGENT_POLLY_MODEL\" \\\n  -p \"$prompt\" \\\n  --no-session\
        \ \\\n  2>polly-stderr.log \\\n  | tee /tmp/polly_output.txt \\\n  || { echo \"::warning::Polly\
        \ review exited non-zero\"; cat polly-stderr.log; }\n\n# Strip coordination text using a review\
        \ marker or markdown heading.\n# Missing review content fails the step so diagnostic logs are\
        \ saved.\npython3 -c \"\nimport re, pathlib\nraw = pathlib.Path('/tmp/polly_output.txt').read_text()\n\
        sentinel = '<!-- POLLY_REVIEW_START -->'\n# Headless output can include earlier drafts before\
        \ the final review.\n# Only standalone marker lines separate reviews; inline quotes do not.\n\
        markers = list(re.finditer(r'^' + re.escape(sentinel) + r'$', raw, re.MULTILINE))\nif markers:\n\
        \    cleaned = raw[markers[-1].end():].lstrip('\\n')\nelse:\n    m = re.search(r'^#{1,6} ', raw,\
        \ re.MULTILINE)\n    cleaned = raw[m.start():] if m else ''\nif not cleaned.strip():\n    raise\
        \ SystemExit('::error::Polly produced no publishable review; see the failure logs artifact.')\n\
        pathlib.Path('/tmp/polly_output.txt').write_text(cleaned)\n\"\n\n# Use a collision-resistant random\
        \ delimiter so model output\n# containing \"REVIEW_EOF\" cannot truncate the output.\ndelim=\"\
        REVIEW_$(openssl rand -hex 8)\"\necho \"review_text<<${delim}\" >> \"$GITHUB_OUTPUT\"\n# Cap at\
        \ 60 KB \u2014 GitHub comment body limit is ~65 KB.\nhead -c 61440 /tmp/polly_output.txt >> \"\
        $GITHUB_OUTPUT\"\necho \"${delim}\" >> \"$GITHUB_OUTPUT\"\n"
    - name: Posting handoff must stay empty
      if: always()
      env:
        REVIEW_TEXT: ${{ steps.polly.outputs.review_text }}
      run: test -z "$REVIEW_TEXT"
    - name: Prepare Polly failure diagnostics
      if: failure()
      env:
        LLM_API_KEY: canary-fake-key
        GATEWAY_BASE_URL: https://canary.invalid
      run: "python3 <<'PY'\nimport os, pathlib\ndestination = pathlib.Path('/tmp/polly-diagnostics')\n\
        destination.mkdir(parents=True, exist_ok=True)\nsources = {\n    'polly-stderr.log': pathlib.Path('polly-stderr.log'),\n\
        \    'polly-output.txt': pathlib.Path('/tmp/polly_output.txt'),\n}\nlogs = pathlib.Path.home()\
        \ / '.omnigent' / 'logs'\nfor source in logs.rglob('*.log'):\n    sources['process-logs/' + str(source.relative_to(logs))]\
        \ = source\nfor name, source in sources.items():\n    if not source.is_file():\n        continue\n\
        \    text = source.read_text(errors='replace')\n    for key in ('LLM_API_KEY', 'GATEWAY_BASE_URL'):\n\
        \        value = os.environ.get(key)\n        if value:\n            text = text.replace(value,\
        \ '[REDACTED]')\n    target = destination / name\n    target.parent.mkdir(parents=True, exist_ok=True)\n\
        \    target.write_text(text)\nPY\n"
    - name: Upload logs on failure
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: polly-empty-output-${{ matrix.scenario }}-${{ github.run_id }}
        path: /tmp/polly-diagnostics/
        retention-days: 7
        if-no-files-found: ignore
